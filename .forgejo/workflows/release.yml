name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  ci:
    name: CI
    uses: ./.forgejo/workflows/ci.yml

  security:
    name: Security
    uses: ./.forgejo/workflows/security.yml

  semver:
    name: SemVer guardrails
    uses: ./.forgejo/workflows/semver.yml

  release:
    name: Publish release
    needs: [ci, security, semver]
    if: startsWith(forge.ref, 'refs/tags/v')
    runs-on: [docker, victus-builder]
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ forge.ref }}
      - name: Cache Python packages
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-${{ runner.arch }}-uv-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-uv-
      - name: Install release tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends make python3 python3-venv python3-pip
          python3 -m venv .venv-release
          . .venv-release/bin/activate
          python -m pip install --upgrade pip uv==0.12.4
          uv sync --frozen --active --group controller --group worker-runtime --group dev
          make release-artifacts SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          test -n "$(find dist/release -maxdepth 1 -type f -print -quit)"
      - name: Prepare runner-provided Docker
        run: bash ./tools/ci/bootstrap_docker.sh
      - name: Log in to Forgejo Container Registry
        env:
          FORGEJO_REGISTRY_USER: ${{ secrets.PACKAGE_REGISTRY_USER }}
          FORGEJO_REGISTRY_TOKEN: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}
        run: |
          printf '%s\n' "$FORGEJO_REGISTRY_TOKEN" \
            | docker login git.seasonalnet.org --username "$FORGEJO_REGISTRY_USER" --password-stdin
      - name: Build and publish release images
        env:
          IMAGE_REPOSITORY_BASE: git.seasonalnet.org/seasonalnet/seasonalweather
          IMAGE_TAG: ${{ forge.ref_name }}
          SW_IMAGE_PUSH_MODE: engine
        run: |
          . .venv-release/bin/activate
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          make PYTHON=.venv-release/bin/python TARGET_PLATFORM=linux/amd64 \
              IMAGE_REPOSITORY_BASE="$IMAGE_REPOSITORY_BASE" IMAGE_TAG="$IMAGE_TAG" \
              SOURCE_DATE_EPOCH="$source_date_epoch" release-images
      - name: Publish Forgejo release
        uses: https://code.forgejo.org/actions/forgejo-release@v2.13.4
        with:
          direction: upload
          release-dir: dist/release/
          token: ${{ forge.token }}
          tag: ${{ forge.ref_name }}
          sha: ${{ forge.sha }}
          prerelease: ${{ contains(forge.ref_name, '-') }}
