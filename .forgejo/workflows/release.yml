name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  ci:
    name: CI
    uses: ./.forgejo/workflows/ci.yml

  security:
    name: Security
    uses: ./.forgejo/workflows/security.yml

  semver:
    name: SemVer guardrails
    uses: ./.forgejo/workflows/semver.yml

  release:
    name: Publish release
    needs: [ci, security, semver]
    if: startsWith(forge.ref, 'refs/tags/v')
    runs-on: [docker, slate-builder]
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ forge.ref }}
      - name: Prepare runner-provided Docker
        shell: bash
        run: bash ./tools/ci/bootstrap_docker.sh
      - name: Cache Python packages
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-${{ runner.arch }}-uv-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-uv-
      - name: Install release tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates cmake make python3 python3-venv python3-pip
          python3 -m venv .venv-bootstrap
          . .venv-bootstrap/bin/activate
          python -m pip install --upgrade pip uv==0.13.5
          uv python install 3.15.1
          uv venv --clear --python 3.15.1 .venv-release
          . .venv-release/bin/activate
          uv sync --frozen --active --group controller --group worker-runtime --group dev
          make release-artifacts SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          test -n "$(find dist/release -maxdepth 1 -type f -print -quit)"
      - name: Trust the SeasonalNet Harbor CA
        run: update-ca-certificates
      - name: Log in to Harbor
        env:
          HARBOR_CI_USERNAME: ${{ secrets.HARBOR_CI_USERNAME }}
          HARBOR_CI_PASSWORD: ${{ secrets.HARBOR_CI_PASSWORD }}
        run: printf '%s' "$HARBOR_CI_PASSWORD" | docker login registry.lan.seasonalnet.org --username "$HARBOR_CI_USERNAME" --password-stdin
      - name: Build and publish Harbor images
        env:
          IMAGE_REPOSITORY_BASE: registry.lan.seasonalnet.org/seasonalnet/seasonalweather
          IMAGE_TAG: ${{ forge.ref_name }}
        run: |
          . .venv-release/bin/activate
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          make PYTHON=.venv-release/bin/python TARGET_PLATFORM=linux/amd64 \
              IMAGE_REPOSITORY_BASE="$IMAGE_REPOSITORY_BASE" IMAGE_TAG="$IMAGE_TAG" \
              SOURCE_DATE_EPOCH="$source_date_epoch" release-images
      - name: Publish Forgejo release
        uses: https://code.forgejo.org/actions/forgejo-release@v2.13.4
        with:
          direction: upload
          release-dir: dist/release/
          token: ${{ forge.token }}
          tag: ${{ forge.ref_name }}
          sha: ${{ forge.sha }}
          prerelease: ${{ contains(forge.ref_name, '-') }}
