name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

jobs:
  scope:
    runs-on: [docker, normal, general]
    outputs:
      run_checks: ${{ steps.classify.outputs.run_checks }}
      run_images: ${{ steps.classify.outputs.run_images }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "${REF#refs/tags/}" != "$REF" ]; then
            printf 'run_checks=true\nrun_images=true\n' >> "$FORGEJO_OUTPUT"
          else
            if [ "$EVENT_NAME" = "pull_request" ]; then
              base="$PR_BASE"
            elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              base="$BEFORE"
            else
              base="HEAD^"
            fi
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="HEAD^"
              git cat-file -e "${base}^{commit}"
            fi
            python3 tools/ci/image_changes.py --base "$base" >> "$FORGEJO_OUTPUT"
            git diff --check "$base" HEAD
          fi

  python:
    needs: scope
    if: needs.scope.outputs.run_checks == 'true'
    runs-on: [docker, normal, general]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Cache Python packages
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-${{ runner.arch }}-uv-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-uv-
      - name: Select suppression comparison base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE"
          else
            base="HEAD^"
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "Comparison base ${base} is unavailable (likely after a rewritten push); using HEAD^ instead."
            base="HEAD^"
            git cat-file -e "${base}^{commit}"
          fi
          echo "QUALITY_SUPPRESSIONS_BASE=$base" >> "$FORGEJO_ENV"
      - name: Install Python tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake make python3 python3-venv python3-pip
          python3 -m venv .venv-bootstrap
          . .venv-bootstrap/bin/activate
          python -m pip install --upgrade pip uv==0.13.8
          .venv-bootstrap/bin/uv python install 3.15.2
          .venv-bootstrap/bin/uv venv --clear --python 3.15.2 .venv
          . .venv/bin/activate
          .venv-bootstrap/bin/uv sync --frozen --active --group controller --group worker-runtime --group dev
      - name: Audit locked Python dependencies
        run: .venv-bootstrap/bin/uv audit --locked --preview-features audit-command
      - name: Run the repository check interface
        run: |
          . .venv/bin/activate
          make check PYTEST_XDIST_ARGS="-n 4 --dist=loadfile"

  images:
    needs: [scope, python]
    if: needs.scope.outputs.run_images == 'true'
    runs-on: [docker, normal, builder]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Cache Python packages
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-${{ runner.arch }}-uv-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-uv-
      - name: Prepare runner-provided Docker
        shell: bash
        run: bash ./tools/ci/bootstrap_docker.sh
      - name: Install Python tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake make python3 python3-venv python3-pip
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip uv==0.13.8
          .venv/bin/uv sync --frozen --active --group controller --group worker-runtime --group dev
      - name: Build, inspect, and synthesize with the Phase 2 image matrix
        run: |
          . .venv/bin/activate
          make phase2-images
