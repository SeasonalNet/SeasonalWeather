name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  python:
    runs-on: [docker, victus-fast]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select suppression comparison base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE"
          else
            base="HEAD^"
          fi
          git cat-file -e "${base}^{commit}"
          echo "QUALITY_SUPPRESSIONS_BASE=$base" >> "$FORGEJO_ENV"
      - name: Install Python tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends make python3 python3-venv python3-pip
          python3 -m venv .venv-ci
          . .venv-ci/bin/activate
          python -m pip install --upgrade pip uv==0.12.4
          uv sync --frozen --active --group controller --group worker-runtime --group dev
      - name: Run the repository check interface
        run: |
          . .venv-ci/bin/activate
          make check

  images:
    needs: python
    runs-on: [docker, victus-builder]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare runner-provided Docker
        shell: bash
        run: bash ./tools/ci/bootstrap_docker.sh
      - name: Install Python tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends make python3 python3-venv python3-pip
          python3 -m venv .venv-ci
          . .venv-ci/bin/activate
          python -m pip install --upgrade pip uv==0.12.4
          uv sync --frozen --active --group controller --group worker-runtime --group dev
      - name: Build and inspect the Phase 2 image matrix
        run: |
          . .venv-ci/bin/activate
          make phase2-images
