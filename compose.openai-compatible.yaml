# Optional overlay for a controller connection to an externally managed
# OpenAI-compatible speech API. The base Compose graph remains local-only
# unless this file is explicitly supplied.

services:
  controller:
    secrets:
      - source: OPENAI_COMPATIBLE_API_KEY
        target: OPENAI_COMPATIBLE_API_KEY
        uid: "10001"
        gid: "10001"
        mode: "0400"

secrets:
  OPENAI_COMPATIBLE_API_KEY:
    file: ${SEASONALWEATHER_SECRET_DIR:-./secrets}/OPENAI_COMPATIBLE_API_KEY
