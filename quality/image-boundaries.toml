version = 3
status = "active"
owner = "SeasonalWeather maintainers"
rationale = "P2-02 and P2-03 define separate controller and worker image ownership with negative dependency and package-boundary checks; the controller additionally owns native SAME tooling and its shared ffmpeg media decoder."
scope = "P2-02 controller image and P2-03 worker image profiles, including controller-owned native SAME tooling; deployment hardening remains deferred to later packets."
review_date = "2026-10-23"
removal_condition = "Replace these rules only when the controller image ownership or profile boundary is deliberately revised."
controller_definition = "Dockerfile"
controller_requirements = "pyproject.toml"
build_context_ignore = ".dockerignore"
controller_catalog_source = "seasonalweather/diagnostics/catalog/source.json"
controller_catalog_compiled = "seasonalweather/diagnostics/catalog/catalog.json"
controller_catalog_explanations = "seasonalweather/diagnostics/catalog/explanations"
controller_user = "seasonalweather"
controller_uid = 10001
controller_gid = 10001
required_dockerfile_tokens = [
  "FROM ${PYTHON_BASE} AS builder",
  "FROM ${RUST_IMAGE} AS same-tools",
  "FROM ${PYTHON_BASE} AS controller",
  "COPY seasonalweather ./seasonalweather",
  "COPY pyproject.toml uv.lock README.md ./",
  "uv sync --frozen --no-dev --group controller",
  "seasonalweather diagnostics export --output /usr/share/seasonalweather/diagnostics",
  "apt-get install --yes --no-install-recommends ffmpeg",
  "COPY --from=same-tools /out/usr/local/bin/samegen /usr/local/bin/samegen",
  "COPY --from=same-tools /out/usr/local/bin/samedec /usr/local/bin/samedec",
  "/usr/share/seasonalweather/build-info.json",
  "groupadd --gid 10001 seasonalweather",
  "useradd --uid 10001 --gid 10001",
  "shutil.rmtree(package_root / worker_root",
  "USER seasonalweather",
  "HEALTHCHECK",
  "ENTRYPOINT [\"python\", \"-m\", \"seasonalweather.api.server\"]",
]
forbidden_dockerfile_tokens = [
  "piper-tts",
  "sox",
  "espeak",
  "legacy-tts",
  "routine-worker",
  "maintenance",
]
required_controller_packages = [
  "fastapi==",
  "httpx2==",
  "slixmpp==",
  "SQLAlchemy==",
  "uvicorn",
]
forbidden_controller_packages = [
  "piper-tts",
  "samedec",
  "samegen",
  "espeak",
]
required_context_ignore_tokens = [".git", ".venv", "*.env"]
controller_tts_prune_paths = ["tts/local.py", "tts/voicetext_paul_vtml.py"]

worker_definition = "Dockerfile.worker"
worker_profiles = ["routine-worker", "piper", "espeak", "festival", "dectalk", "legacy-tts", "voicetext-paul", "spfy", "maintenance", "development"]
worker_requirements = ["pyproject.toml"]
worker_dependency_groups = ["worker-runtime", "piper"]
required_worker_dockerfile_tokens = [
  "ENTRYPOINT [\"python\", \"-m\", \"seasonalweather\", \"worker\"]",
  "USER seasonalweather",
  "seasonalweather diagnostics export --output /usr/share/seasonalweather/diagnostics",
  "/usr/share/seasonalweather/build-info.json",
]
forbidden_worker_dockerfile_tokens = [
  "EXPOSE",
  "requirements-controller.txt",
  "slixmpp",
  "SQLAlchemy",
  "fastapi",
  "uvicorn",
]
forbidden_worker_dependency_tokens = [
  "slixmpp",
  "sqlalchemy",
  "fastapi",
  "uvicorn",
]
