# Restart-surviving controller state belongs in the owned database. These are
# the only callable-level exceptions for JSON files: bounded health probes,
# worker interchange descriptors, immutable build/diagnostic exports, and the
# one-start legacy compatibility writers. New JSON filesystem writers must
# use a database repository instead of adding an exception here.
json_persistence_roots = ["seasonalweather", "scripts"]
json_persistence_path_factories = ["_journal_path", "_receipt_path"]
json_persistence_allowed_scripts = []
