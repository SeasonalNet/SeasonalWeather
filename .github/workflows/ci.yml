name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Cache Python packages
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-${{ runner.arch }}-uv-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-uv-
      - name: Expose GitHub cache runtime
        uses: crazy-max/ghaction-github-runtime@v3
        continue-on-error: true
      - name: Enable GitHub BuildKit cache
        run: |
          if [ -z "${ACTIONS_RUNTIME_TOKEN:-}" ] || [ -z "${ACTIONS_CACHE_URL:-}${ACTIONS_RESULTS_URL:-}" ]; then
            echo "GitHub BuildKit cache runtime is unavailable; continuing without a remote build cache."
            exit 0
          fi
          {
            echo 'SW_BUILD_CACHE_FROM=type=gha,scope=seasonalweather-{profile}'
            echo 'SW_BUILD_CACHE_TO=type=gha,mode=max,ignore-error=true,scope=seasonalweather-{profile}'
          } >> "$GITHUB_ENV"
      - name: Select suppression comparison base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE"
          else
            base="HEAD^"
          fi
          git cat-file -e "${base}^{commit}"
          echo "QUALITY_SUPPRESSIONS_BASE=$base" >> "$GITHUB_ENV"
      - name: Install Python tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make python3 python3-venv python3-pip
          python3 -m venv .venv-ci
          . .venv-ci/bin/activate
          python -m pip install --upgrade pip uv==0.12.4
          uv sync --frozen --active --group controller --group worker-runtime --group dev
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Run the Phase 2 exit gate
        run: |
          . .venv-ci/bin/activate
          make phase2-gate
