name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      run_checks: ${{ steps.classify.outputs.run_checks }}
      run_images: ${{ steps.classify.outputs.run_images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "${REF#refs/tags/}" != "$REF" ]; then
            printf 'run_checks=true\nrun_images=true\n' >> "$GITHUB_OUTPUT"
          else
            if [ "$EVENT_NAME" = "pull_request" ]; then
              base="$PR_BASE"
            elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              base="$BEFORE"
            else
              base="HEAD^"
            fi
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="HEAD^"
              git cat-file -e "${base}^{commit}"
            fi
            python3 tools/ci/image_changes.py --base "$base" >> "$GITHUB_OUTPUT"
            git diff --check "$base" HEAD
          fi

  python:
    needs: scope
    if: needs.scope.outputs.run_checks == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Cache Python packages
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-${{ runner.arch }}-uv-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-uv-
      - name: Expose GitHub cache runtime
        if: needs.scope.outputs.run_images == 'true'
        uses: crazy-max/ghaction-github-runtime@v3
        continue-on-error: true
      - name: Enable GitHub BuildKit cache
        if: needs.scope.outputs.run_images == 'true'
        run: |
          if [ -z "${ACTIONS_RUNTIME_TOKEN:-}" ] || [ -z "${ACTIONS_CACHE_URL:-}${ACTIONS_RESULTS_URL:-}" ]; then
            echo "GitHub BuildKit cache runtime is unavailable; continuing without a remote build cache."
            exit 0
          fi
          {
            echo 'SW_BUILD_CACHE_FROM=type=gha,scope=seasonalweather-{profile}'
            echo 'SW_BUILD_CACHE_TO=type=gha,mode=max,ignore-error=true,scope=seasonalweather-{profile}'
          } >> "$GITHUB_ENV"
      - name: Select suppression comparison base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE"
          else
            base="HEAD^"
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "Comparison base ${base} is unavailable (likely after a rewritten push); using HEAD^ instead."
            base="HEAD^"
            git cat-file -e "${base}^{commit}"
          fi
          echo "QUALITY_SUPPRESSIONS_BASE=$base" >> "$GITHUB_ENV"
      - name: Install Python tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake make python3 python3-venv python3-pip
          python3 -m venv .venv-bootstrap
          . .venv-bootstrap/bin/activate
          python -m pip install --upgrade pip uv==0.13.5
          .venv-bootstrap/bin/uv python install 3.15.1
          .venv-bootstrap/bin/uv venv --clear --python 3.15.1 .venv
          . .venv/bin/activate
          .venv-bootstrap/bin/uv sync --frozen --active --group controller --group worker-runtime --group dev
      - name: Audit locked Python dependencies
        run: .venv-bootstrap/bin/uv audit --locked --preview-features audit-command
      - name: Set up Docker Buildx
        if: needs.scope.outputs.run_images == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Run the repository check interface
        run: |
          . .venv/bin/activate
          make check
      - name: Build, inspect, and synthesize with the Phase 2 image matrix
        if: needs.scope.outputs.run_images == 'true'
        run: |
          . .venv/bin/activate
          make phase2-images
