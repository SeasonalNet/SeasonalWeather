name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  security:
    name: Security
    uses: ./.github/workflows/security.yml

  semver:
    name: SemVer guardrails
    uses: ./.github/workflows/semver.yml

  release:
    name: Publish release
    needs: [ci, security, semver]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: .cache/uv
      SW_BUILD_CACHE_FROM: type=gha,scope=seasonalweather-{profile}
      SW_BUILD_CACHE_TO: type=gha,mode=max,ignore-error=true,scope=seasonalweather-{profile}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Cache Python packages
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .cache/uv
          key: ${{ runner.os }}-${{ runner.arch }}-uv-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-uv-
      - name: Expose GitHub cache runtime
        uses: crazy-max/ghaction-github-runtime@v3
        continue-on-error: true
      - name: Enable GitHub BuildKit cache
        run: |
          if [ -z "${ACTIONS_RUNTIME_TOKEN:-}" ] || [ -z "${ACTIONS_CACHE_URL:-}${ACTIONS_RESULTS_URL:-}" ]; then
            echo "GitHub BuildKit cache runtime is unavailable; continuing without a remote build cache."
            exit 0
          fi
          {
            echo 'SW_BUILD_CACHE_FROM=type=gha,scope=seasonalweather-{profile}'
            echo 'SW_BUILD_CACHE_TO=type=gha,mode=max,ignore-error=true,scope=seasonalweather-{profile}'
          } >> "$GITHUB_ENV"
      - name: Install release tooling
        run: |
          python3 -m venv .venv-release
          . .venv-release/bin/activate
          python -m pip install --upgrade pip uv==0.12.4
          uv sync --frozen --active --group controller --group worker-runtime --group dev
      - name: Build release artifacts
        run: |
          . .venv-release/bin/activate
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" make release-artifacts
          test -n "$(find dist/release -maxdepth 1 -type f -print -quit)"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish release images
        env:
          IMAGE_REPOSITORY_BASE: ghcr.io/seasonalnet/seasonalweather
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          . .venv-release/bin/activate
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          make PYTHON=.venv-release/bin/python TARGET_PLATFORM=linux/amd64 \
              IMAGE_REPOSITORY_BASE="$IMAGE_REPOSITORY_BASE" IMAGE_TAG="$IMAGE_TAG" \
              SOURCE_DATE_EPOCH="$source_date_epoch" release-images
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/release/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
