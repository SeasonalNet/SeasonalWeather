    image: ${SEASONALWEATHER_LEGACY_TTS_WORKER_IMAGE:-seasonalweather-worker:legacy-tts}
    <<: *seasonal-security
    user: "10001:10001"
    entrypoint:
      - python
      - -m
      - seasonalweather
      - worker
    command:
      - --controller-url
      - ws://controller:9080/v1/workers/connect
