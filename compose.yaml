name: ${SEASONALWEATHER_COMPOSE_PROJECT:-seasonalweather}

x-seasonal-security: &seasonal-security
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec
    - /run:rw,nosuid,nodev,noexec

services:
  controller:
    image: ${SEASONALWEATHER_CONTROLLER_IMAGE:-seasonalweather:standard}
    <<: *seasonal-security
    user: "10001:10001"
    entrypoint:
      - python
      - -m
      - seasonalweather.api.server
    command:
      - --config
      - /etc/seasonalweather/config.yaml
      - --host
      - 0.0.0.0
      - --port
      - "9080"
    expose:
      - "9080"
    environment:
      LIQUIDSOAP_TELNET_HOST: liquidsoap
      LIQUIDSOAP_TELNET_PORT: "1234"
    volumes:
      - ${SEASONALWEATHER_CONFIG_FILE:-./config/config.yaml}:/etc/seasonalweather/config.yaml:ro
      - seasonalweather-state:/var/lib/seasonalweather/state
      - seasonalweather-jobs:/var/lib/seasonalweather/jobs
      - seasonalweather-artifacts:/var/lib/seasonalweather/artifacts
      - type: volume
        source: seasonalweather-artifact-staging
        target: /var/lib/seasonalweather/artifacts/worker-artifacts/staging
      - seasonalweather-logs:/var/log/seasonalweather
    secrets:
      - source: ICECAST_SOURCE_PASSWORD
        target: ICECAST_SOURCE_PASSWORD
        uid: "10001"
        gid: "10001"
        mode: "0400"
      - source: SEASONAL_API_TOKEN
        target: SEASONAL_API_TOKEN
        uid: "10001"
        gid: "10001"
        mode: "0400"
      - source: SEASONAL_WORKER_TOKEN
        target: SEASONAL_WORKER_TOKEN
        uid: "10001"
        gid: "10001"
        mode: "0400"
    depends_on:
      liquidsoap:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - seasonalweather
        - health
        - controller
        - --mode
        - readiness
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  routine-worker:
    image: ${SEASONALWEATHER_ROUTINE_WORKER_IMAGE:-seasonalweather-worker:standard}
    <<: *seasonal-security
    user: "10001:10001"
    entrypoint:
      - python
      - -m
      - seasonalweather
      - worker
    command:
      - --controller-url
      - ws://controller:9080/v1/workers/connect
      - --profile
      - routine-worker
      - --worker-id
      - ${SEASONALWEATHER_ROUTINE_WORKER_ID:-routine-worker}
    environment:
      SEASONALWEATHER_CONTROLLER_URL: ws://controller:9080/v1/workers/connect
      SEASONALWEATHER_WORKER_ID: ${SEASONALWEATHER_ROUTINE_WORKER_ID:-routine-worker}
      SEASONALWEATHER_WORKER_PROFILE: routine-worker
      SEASONALWEATHER_WORKER_HEALTH_FILE: /tmp/seasonalweather-worker-health.json
    volumes:
      - type: volume
        source: seasonalweather-artifacts
        target: /var/lib/seasonalweather/artifacts
        read_only: true
      - type: volume
        source: seasonalweather-artifact-staging
        target: /var/lib/seasonalweather/artifacts/worker-artifacts/staging
    secrets:
      - source: SEASONAL_WORKER_TOKEN
        target: SEASONAL_WORKER_TOKEN
        uid: "10001"
        gid: "10001"
        mode: "0400"
    depends_on:
      controller:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - seasonalweather
        - health
        - worker
        - --mode
        - liveness
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

