      SEASONALWEATHER_WORKER_ID: ${SEASONALWEATHER_FESTIVAL_WORKER_ID:-festival-worker}
      SEASONALWEATHER_WORKER_PROFILE: festival
      SEASONALWEATHER_WORKER_HEALTH_FILE: /tmp/seasonalweather-festival-worker-health.json
