      timeout: 5s
      start_period: 30s
      retries: 3

  spfy-worker:
    profiles:
      - spfy
    image: ${SEASONALWEATHER_SPFY_WORKER_IMAGE:-seasonalweather-worker:spfy}
    <<: *seasonal-security
    user: "10001:10001"
    entrypoint:
      - python
      - -m
      - seasonalweather
      - worker
    command:
      - --controller-url
      - ws://controller:9080/v1/workers/connect
      - --profile
      - spfy
      - --worker-id
      - ${SEASONALWEATHER_SPFY_WORKER_ID:-spfy-worker}
    environment:
      SEASONALWEATHER_CONTROLLER_URL: ws://controller:9080/v1/workers/connect
      SEASONALWEATHER_WORKER_ID: ${SEASONALWEATHER_SPFY_WORKER_ID:-spfy-worker}
      SEASONALWEATHER_WORKER_PROFILE: spfy
      SEASONALWEATHER_WORKER_HEALTH_FILE: /tmp/seasonalweather-spfy-worker-health.json
      SPFY_VOICE_DIR: /opt/spfy
      SPFY_NO_UPDATE_CHECK: "1"
    volumes:
      - type: volume
        source: seasonalweather-artifacts
        target: /var/lib/seasonalweather/artifacts
        read_only: true
      - type: volume
        source: seasonalweather-artifact-staging
        target: /var/lib/seasonalweather/artifacts/worker-artifacts/staging
    secrets:
      - source: SEASONAL_WORKER_TOKEN
        target: SEASONAL_WORKER_TOKEN
        uid: "10001"
        gid: "10001"
        mode: "0400"
    depends_on:
      controller:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - seasonalweather
        - health
        - worker
        - --mode
        - liveness
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  maintenance-worker:
    profiles:
      - maintenance
    image: ${SEASONALWEATHER_MAINTENANCE_WORKER_IMAGE:-seasonalweather-worker:maintenance}
