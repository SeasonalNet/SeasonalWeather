      SEASONALWEATHER_WORKER_PROFILE: piper
      SEASONALWEATHER_WORKER_HEALTH_FILE: /tmp/seasonalweather-piper-worker-health.json
      PIPER_MODEL_DIR: /opt/piper/models
    volumes:
      - type: volume
        source: seasonalweather-artifacts
        target: /var/lib/seasonalweather/artifacts
        read_only: true
      - type: volume
        source: seasonalweather-artifact-staging
        target: /var/lib/seasonalweather/artifacts/worker-artifacts/staging
      - type: bind
        source: ${SEASONALWEATHER_PIPER_MODEL_DIR:-/var/lib/seasonalweather/piper-models}
        target: /opt/piper/models
        read_only: true
    secrets:
      - source: SEASONAL_WORKER_TOKEN
        target: SEASONAL_WORKER_TOKEN
        uid: "10001"
        gid: "10001"
        mode: "0400"
    depends_on:
      controller:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -m
