        - CMD
        - python
        - -m
        - seasonalweather
        - health
        - worker
        - --mode
        - liveness
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  voicetext-paul-worker:
    profiles:
      - voicetext-paul
    image: ${SEASONALWEATHER_VOICETEXT_PAUL_WORKER_IMAGE:-seasonalweather-worker:voicetext-paul}
    <<: *seasonal-security
    user: "10001:10001"
    entrypoint:
      - /usr/local/bin/voicetext-paul-entrypoint
    command:
      - --controller-url
      - ws://controller:9080/v1/workers/connect
      - --profile
      - voicetext-paul
      - --worker-id
      - ${SEASONALWEATHER_VOICETEXT_PAUL_WORKER_ID:-voicetext-paul-worker}
    environment:
      SEASONALWEATHER_CONTROLLER_URL: ws://controller:9080/v1/workers/connect
      SEASONALWEATHER_WORKER_ID: ${SEASONALWEATHER_VOICETEXT_PAUL_WORKER_ID:-voicetext-paul-worker}
      SEASONALWEATHER_WORKER_PROFILE: voicetext-paul
      SEASONALWEATHER_WORKER_HEALTH_FILE: /tmp/seasonalweather-voicetext-paul-worker-health.json
      DISPLAY: :99
      HOME: /tmp/voicetext/home
      VOICETEXT_PAUL_TMPDIR: /tmp/voicetext
      VOICETEXT_PAUL_LOCK_PATH: /tmp/voicetext/voicetext.lock
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec
      - /run:rw,nosuid,nodev,noexec
      - /tmp/.X11-unix:rw,nosuid,nodev,noexec,mode=1777,uid=0,gid=0
    volumes:
      - type: volume
        source: seasonalweather-artifacts
        target: /var/lib/seasonalweather/artifacts
        read_only: true
      - type: volume
        source: seasonalweather-artifact-staging
        target: /var/lib/seasonalweather/artifacts/worker-artifacts/staging
      - type: volume
        source: seasonalweather-voicetext-paul-voices
        target: /var/lib/seasonalweather/voices/voicetext_paul
      - type: volume
        source: seasonalweather-voicetext-paul-wineprefixes
        target: /var/lib/seasonalweather/wineprefixes
    secrets:
      - source: SEASONAL_WORKER_TOKEN
        target: SEASONAL_WORKER_TOKEN
        uid: "10001"
        gid: "10001"
        mode: "0400"
