      SEASONALWEATHER_WORKER_ID: ${SEASONALWEATHER_MAINTENANCE_WORKER_ID:-maintenance-worker}
      SEASONALWEATHER_WORKER_PROFILE: maintenance
      SEASONALWEATHER_WORKER_HEALTH_FILE: /tmp/seasonalweather-maintenance-health.json
    volumes:
      - type: volume
        source: seasonalweather-artifacts
        target: /var/lib/seasonalweather/artifacts
        read_only: true
      - type: volume
        source: seasonalweather-artifact-staging
        target: /var/lib/seasonalweather/artifacts/worker-artifacts/staging
    secrets:
      - source: SEASONAL_WORKER_TOKEN
        target: SEASONAL_WORKER_TOKEN
        uid: "10001"
        gid: "10001"
        mode: "0400"
    depends_on:
      controller:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - seasonalweather
        - health
        - worker
        - --mode
        - liveness
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  liquidsoap:
    image: ${SEASONALWEATHER_LIQUIDSOAP_IMAGE:-savonet/liquidsoap:v2.3.3}
    <<: *seasonal-security
    command:
      - /etc/seasonalweather/radio.liq
    environment:
      SEASONALWEATHER_CONTAINER: "true"
      SEASONALWEATHER_LIQUIDSOAP_TELNET_BIND_ADDR: 0.0.0.0
      SEASONALWEATHER_ICECAST_HOST: ${SEASONALWEATHER_ICECAST_HOST:-icecast}
      SEASONALWEATHER_ICECAST_PORT: ${SEASONALWEATHER_ICECAST_PORT:-8000}
      SEASONALWEATHER_ICECAST_PASSWORD_FILE: /run/secrets/ICECAST_SOURCE_PASSWORD
    volumes:
      - ./liquidsoap/radio.liq:/etc/seasonalweather/radio.liq:ro
      - seasonalweather-artifacts:/var/lib/seasonalweather/artifacts:ro
    secrets:
      - source: ICECAST_SOURCE_PASSWORD
        target: ICECAST_SOURCE_PASSWORD
        uid: "1000"
        gid: "1000"
        mode: "0400"

  icecast:
    profiles:
      - icecast
    image: ${SEASONALWEATHER_ICECAST_IMAGE:-ghcr.io/libretime/icecast:2.5.0}
    <<: *seasonal-security
    ports:
      - ${SEASONALWEATHER_ICECAST_PUBLISHED_PORT:-8000}:8000
    volumes:
      - ${SEASONALWEATHER_ICECAST_CONFIG_FILE:-./config/icecast.xml}:/etc/icecast.xml:ro

secrets:
  ICECAST_SOURCE_PASSWORD:
    file: ${SEASONALWEATHER_SECRET_DIR:-./secrets}/ICECAST_SOURCE_PASSWORD
  SEASONAL_API_TOKEN:
    file: ${SEASONALWEATHER_SECRET_DIR:-./secrets}/SEASONAL_API_TOKEN
  SEASONAL_WORKER_TOKEN:
    file: ${SEASONALWEATHER_SECRET_DIR:-./secrets}/SEASONAL_WORKER_TOKEN

volumes:
  seasonalweather-state:
  seasonalweather-jobs:
  seasonalweather-artifacts:
  seasonalweather-artifact-staging:
  seasonalweather-logs:
  seasonalweather-voicetext-paul-voices:
  seasonalweather-voicetext-paul-wineprefixes:
