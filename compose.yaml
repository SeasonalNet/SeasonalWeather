  dectalk-worker:
    profiles:
      - dectalk
    image: ${SEASONALWEATHER_DECTALK_WORKER_IMAGE:-seasonalweather-worker:dectalk}
    <<: *seasonal-security
    user: "10001:10001"
    entrypoint:
      - python
      - -m
