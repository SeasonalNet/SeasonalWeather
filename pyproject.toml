[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seasonalweather"
description = "Weather automation and alert orchestration service"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies", "version"]

[project.scripts]
seasonalweather = "seasonalweather.__main__:_main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
version = {attr = "seasonalweather.__version__"}

[tool.setuptools.packages.find]
include = ["seasonalweather*"]

[tool.setuptools.package-data]
"seasonalweather.diagnostics" = [
  "catalog/catalog.json",
  "catalog/source.json",
  "catalog/explanations/*.md",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
  "tests/architecture/fixtures/invalid",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.mypy]
python_version = "3.11"
files = ["seasonalweather", "tools/quality"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.deptry]
known_first_party = ["seasonalweather"]
requirements_files = ["requirements.txt"]
requirements_files_dev = ["requirements-dev.txt"]
extend_exclude = [
  "tests/architecture/fixtures",
  "tools/quality",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".venv-ci"]
recursive = true
