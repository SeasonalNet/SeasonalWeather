config_schema: 1

station:
  name: "SeasonalWeather"
  service_area_name: "The Baltimore and Washington, D.C. region, and surrounding counties across Maryland, Virginia, West Virginia, and Pennsylvania"
  timezone: "America/New_York"
  disclaimer: "Please note, SeasonalWeather is not NOAA Weather Radio and is not endorsed by the National Weather Service. For critical information, you should use NOAA Weather Radio, and weather.gov."
  organization_name: "SeasonalNet"
  service_name: "I P Weather Radio Station"
  now_playing_artist: "SeasonalNet"
  now_playing_album: ""

stream:
  icecast_host: "127.0.0.1"
  icecast_port: 8000
  icecast_mount: "seasonalweather.ogg"

# Deployment endpoints and transport policy. Optional PostgreSQL and Redis
# remain disabled until a later packet explicitly activates them.
network:
  api:
    bind_host: "127.0.0.1"
    port: 9080
  liquidsoap:
    host: "127.0.0.1"
    port: 1234
    timeout_seconds: 3.0
  swwp:
    bind_host: "0.0.0.0"
    controller_path: "/v1/workers/connect"
    worker_controller_url: ""
    verify_tls: true
    heartbeat_interval_seconds: 15
    heartbeat_timeout_seconds: 45
    lease_seconds: 60
    assignment_ack_seconds: 10
    max_message_bytes: 65536
    capability_validity_seconds: 60
  postgresql:
    enabled: false
    address: ""
    port: 5432
    database: ""
    tls: true
    connect_timeout_seconds: 5.0
  redis:
    enabled: false
    address: ""
    port: 6379
    database: "0"
    tls: true
    connect_timeout_seconds: 5.0

# Two-mode cycle: normal vs heightened/focus mode
cycle:
  primary_wfo: "LWX"
  normal_interval_seconds: 300
  heightened_interval_seconds: 180
  min_heightened_seconds: 1800  # stay heightened at least this long after a tone-out

  # Active-alert focus-hold policy.  Alerts can remain in rotation without
  # pinning the station in focus mode.  Empty/omitted hold_event_codes inherits
  # policy.toneout_product_types with tests removed, then applies the VTEC and
  # marine guards below.
  alert_focus:
    hold_event_codes: []
    hold_vtec_significance: ["W", "A"]   # warning/watch VTEC only
    excluded_sources: ["PNS_CYCLE"]
    test_event_codes: ["DMO", "NAT", "NPT", "NST", "RMT", "RWT"]
    marine_event_codes: ["SMW", "MWS", "SCY", "GLW", "GLA", "SRW", "SRA", "HSW", "HSA", "HFW", "HFA", "MHY"]
    marine_hold_event_codes: ["SMW"]      # Special Marine Warning is short-fused/life-safety

  reference_points:
    # (lat, lon, label) — used for forecast snippets + obs anchors
    - [38.8521, -77.0377, "Washington"]
    - [39.1774, -76.6684, "Baltimore"]
    - [38.9531, -77.4565, "Dulles"]
    - [39.4015, -77.4144, "Frederick"]
    - [39.6360, -78.7601, "Cumberland"]

    # Maryland (coverage spread: bay → metro → north/east → south)
    - [38.9784, -76.4922, "Annapolis"]
    - [39.2037, -76.8610, "Columbia"]
    - [39.4015, -76.6019, "Towson"]
    - [39.5359, -76.3483, "Bel Air"]
    - [39.5754, -76.9958, "Westminster"]
    - [39.0840, -77.1528, "Rockville"]
    - [38.9428, -76.7303, "Bowie"]
    - [38.6246, -76.9391, "Waldorf"]
    - [38.2912, -76.6358, "Leonardtown"]
    - [39.2090, -76.0666, "Chestertown"]
    - [39.0451, -76.0660, "Centreville"]

    # Virginia / WV / PA edges in your transmitter union
    - [39.1157, -77.5636, "Leesburg"]
    - [38.7509, -77.4753, "Manassas"]
    - [39.1857, -78.1633, "Winchester"]
    - [39.4562, -77.9639, "Martinsburg"]
    - [39.8309, -77.2311, "Gettysburg"]

  # Trim older product text to this many chars before TTS
  last_product_max_chars: 260

  # SPC outlook integration (off by default)
  spc:
    enabled: false
    wfos: ["LWX"]     # WFOs to include in SPC check
    days: 3            # how many outlook days to consider (1..3)
    min_dn: 3          # minimum danger number to speak (3=MRGL, 4=SLGT, 5=ENH, 6=MDT, 8=HIGH)
    timeout_s: 6.0

  # Forecast product tuning
  fc:
    use_short: true         # use shortForecast vs detailedForecast
    periods_normal: 14      # max forecast periods to consider
    periods_per_group: 4    # how many periods per read group
    max_points_normal: 6    # how many reference points to cover in normal mode
    max_points_7day: 2      # how many points in the extended 7-day portion
    point_max_chars: 1600   # max chars per forecast point
    line_max_chars: 1600    # fallback line length cap (same as point_max_chars by default)
    rotate_period_s: 300    # how often (seconds) to rotate to the next point group
    rotate_step: 0          # step size per rotation (0 = use max_points_normal)

  # Observation tuning
  obs:
    max_normal: 0           # max obs stations in normal mode (0 = auto: min(8, len(stations)))
    rotate_period_s: 300
    rotate_step: 0          # 0 = use max_normal
    aliases: {}             # map station ID → display name, e.g. { "KDCA": "Reagan National" }

  # Hazardous Weather Outlook (HWO) tuning
  hwo:
    max_chars_normal: 0       # 0 = unlimited in normal mode
    max_chars_heightened: 0   # deprecated/ignored; heightened mode postpones routine segments instead of truncating
    speak_unavailable: true   # read "no hazardous weather outlook available" if missing

  # Area Forecast Discussion (AFD) tuning
  afd:
    max_chars_normal: 0       # 0 = unlimited
    max_chars_heightened: 0   # deprecated/ignored

  # Synopsis (SYN) tuning
  syn:
    max_chars_normal: 1500
    max_chars_heightened: 0   # deprecated/ignored

  # Mid-Atlantic Offshore Waters Forecast (OFFNT2), disabled until zones are configured.
  offnt2:
    enabled: false
    source_office: "KWBC"
    product_type: "OFF"
    zones: []                  # e.g. [{id: "ANZ450", label: "Coastal waters from Sandy Hook to Manasquan Inlet"}]
    include_synopsis: true
    max_chars_normal: 2400
    max_chars_heightened: 1200
    max_airtime_seconds: 90
    rotate_period_s: 1800
    rotate_step: 1
    defer_in_heightened: true

# Observations station IDs for api.weather.gov/stations/<id>/observations/latest
observations:
  stations: ["KDCA", "KBWI", "KIAD", "KMRB", "KCHO", "KHGR", "KFDK", "KMTN", "KFME", "KGAI", "KJYO", "KHEF", "KADW", "KTHV"]

# NWWS-OI listener
nwws:
  enabled: true
  server: "nwws-oi.weather.gov"
  port: 5222
  room: "NWWS@conference.nwws-oi.weather.gov"
  nick: "SeasonalWeather"
  allowed_wfos: ["KLWX", "KCTP", "KPHI"]
  resiliency:
    stall_seconds: 60           # seconds without a message before declaring stall
    muc_confirm_seconds: 30     # seconds to wait for MUC join confirmation
    start_wait_seconds: 25      # seconds to wait for stream start
    join_wait_seconds: 35       # seconds to wait for room join
    backoff_max_seconds: 90     # max reconnect backoff cap
    rx_log_first_n: 20          # log first N received messages verbosely
    decision_log_first_n: 20    # log first N routing decisions verbosely
    decision_log_every: 0       # log every Nth decision after that (0 = off)

# NWS API user-agent (used for all api.weather.gov calls; set to something identifying)
nws:
  user_agent: ""   # leave empty to use the built-in default

# Public Information Statement policy. PNS is a broad/free-form product
# family; only explicitly configured, coherent subtypes are allowed into
# cycle audio. Tabular/report-style PNS products are suppressed from TTS.
pns:
  enabled: true
  default_expire_hours: 4
  hard_stop_delimiter: "&&"
  suppress_unknown_audio: true
  reject_audio_keywords:
    - "spotter reports"
    - "storm reports"
    - "preliminary local storm report"
    - "metadata"
  subtypes:
    - name: "severe_weather_safety_rules"
      enabled: true
      audio: true
      event: "Severe Weather Safety Rules"
      code: "SPS"
      key_prefix: "PNS_SAFETY"
      intro: "The National Weather Service has issued the following public information statement."
      headline_contains:
        - "...SEVERE WEATHER SAFETY RULES..."
      body_contains_all: []
      body_contains_any: []
      reject_contains: []
      max_fresh_hours: 18
      require_same_day: true
      max_chars: 2400
    - name: "nwr_transmitter_outage"
      enabled: true
      audio: true
      event: "NOAA Weather Radio Service Announcement"
      code: "SPS"
      key_prefix: "PNS_NWR_SERVICE"
      intro: "This is a service announcement from the National Weather Service concerning NOAA Weather Radio transmitters in the service area."
      headline_contains: []
      body_contains_all:
        - "NOAA Weather Radio"
        - "transmitter"
      body_contains_any:
        - "off the air"
        - "offline"
        - "out of service"
        - "technical difficulties"
        - "maintenance"
      reject_contains: []
      max_fresh_hours: 48
      require_same_day: false
      max_chars: 1400
    - name: "nwr_transmitter_restoration"
      enabled: true
      audio: true
      event: "NOAA Weather Radio Service Announcement"
      code: "SPS"
      key_prefix: "PNS_NWR_SERVICE"
      intro: "This is a service announcement from the National Weather Service concerning NOAA Weather Radio transmitters in the service area."
      headline_contains: []
      body_contains_all:
        - "NOAA Weather Radio"
        - "transmitter"
      body_contains_any:
        - "returned to service"
        - "back on the air"
        - "service has been restored"
        - "restored"
      reject_contains: []
      max_fresh_hours: 24
      require_same_day: false
      max_chars: 1200

# Short-Term Forecast (NOW) products are routine, expiring cycle inserts.
# They are targeted from the product UGC block and never generate SAME tones
# or alert-focus state.
now:
  enabled: true
  intro: "A statement from the National Weather Service."
  default_expire_minutes: 60
  # Recovery path for NOW products missed by NWWS-OI. Each configured NWWS
  # office is polled through /products/types/NOW/locations/{WFO}; recent
  # products feed the same targeting, stale-order, and cycle-insert path.
  api_backfill:
    enabled: true
    initial_delay_seconds: 15
    interval_seconds: 120
    lookback_minutes: 120
    max_products_per_office: 25

# Runtime source-health state machine. This does not originate alerts; it
# controls degraded-cycle presentation when SeasonalWeather loses confidence
# in one or more upstream NWS feed paths.
health:
  enabled: true
  check_interval_seconds: 30
  min_hold_seconds: 300
  detached_loop_only: true
  source_impaired_message: "SeasonalWeather is operating with reduced data-feed redundancy. Some information may be delayed."
  degraded_message: "SeasonalWeather is operating in a degraded mode. Some National Weather Service data may be delayed or unavailable."
  critical_message: "SeasonalWeather is operating in a degraded mode. Current watches, warnings, and advisories may be delayed or unavailable."
  detached_message: "SeasonalWeather is temporarily unable to receive current National Weather Service information. Please use another weather information source or visit weather.gov for the latest information."
  sources:
    nwws_oi:
      enabled: true
      role: "alert_redundant"
      stale_after_seconds: 600
      failure_threshold: 2
      critical: false
    cap_api:
      enabled: true
      role: "alert"
      stale_after_seconds: 300
      failure_threshold: 3
      critical: true
    nws_api:
      enabled: true
      role: "forecast"
      stale_after_seconds: 900
      failure_threshold: 3
      critical: false

# KLWX tone-out product types (matches the NWR tone table)
policy:
  toneout_product_types:
    - "TOA"  # Tornado Watch
    - "TOR"  # Tornado Warning
    - "SVA"  # Severe Thunderstorm Watch
    - "SVR"  # Severe Thunderstorm Warning
    - "SMW"  # Special Marine Warning
    - "FFA"  # Flash Flood Watch
    - "FFW"  # Flash Flood Warning
    - "FLW"  # Flood Warning
    - "TRA"  # Tropical Storm Watch
    - "TRW"  # Tropical Storm Warning
    - "HUA"  # Hurricane Watch
    - "HUW"  # Hurricane Warning
    - "WSW"  # Winter Storm Warning
    - "BZW"  # Blizzard Warning
    - "SQW"  # Snow Squall Warning
    - "HWW"  # High Wind Warning
    - "CFW"  # Coastal Flood Warning
    - "CDW"  # Civil Danger Warning
    - "CEM"  # Civil Emergency Message
    - "EAN"  # Emergency Action Notification
    - "EQW"  # Earthquake Warning
    - "EVI"  # Evacuation Immediate
    - "FRW"  # Fire Warning
    - "HMW"  # Hazardous Materials Warning
    - "LAE"  # Local Area Emergency
    - "LEW"  # Law Enforcement Warning
    - "NUW"  # Nuclear Power Plant Warning
    - "RHW"  # Radiological Hazard Warning
    - "SPW"  # Shelter in Place Warning
    - "TOE"  # 911 Telephone Outage Emergency
    # - "FZW"  # Freeze Warning (supported natively; commented out by default)
    # - "FSW"  # Flash Freeze Warning (supported natively; commented out by default)
    - "RWT"  # Required Weekly Test

  # Minimum gap between consecutive tone-outs (prevents "tone spam" when back-to-back products drop)
  min_tone_gap_seconds: 2.0

# SAME / EAS encoding
same:
  enabled: true
  sender: "SEASNWXR"          # 8-char SAME sender ID
  duration_minutes: 60         # default event duration hint
  amplitude: 0.35              # SAME burst amplitude (0.0–1.0)
  native_encoder:
    enabled: false             # optional Rust samegen encoder; Python remains fallback
    bin: "samegen"
    timeout_seconds: 5.0
    fallback_to_python: true

# CAP ingest via NWS alerts API
cap:
  enabled: true
  dryrun: false
  poll_seconds: 60
  user_agent: "SeasonalWeather (CAP monitor)"
  url: ""                      # leave empty to use default NWS alerts endpoint
  ledger_max_age_days: 14
  full:
    enabled: true
    severities: ["Severe", "Extreme"]
    events: []                 # empty = match all events of qualifying severity
    cooldown_seconds: 180
  voice:
    enabled: true              # voice-only interruption (no SAME/tone/EOM) for low-severity
    events:
      - "Special Weather Statement"
      - "Freeze Watch"            # native FZA classification; voice-only by default
    cooldown_seconds: 600

# ERN/JON GWES-ERN Level-3 source monitoring
ern:
  enabled: true
  dryrun: false
  url: "http://radio.wjonip.org/WJONTV"
  name: "ERN/JON"
  decoder_backend: "auto"        # auto | samedec | native
  sample_rate: 48000
  tail_seconds: 10.0
  trigger_ratio: 8.0
  dedupe_seconds: 20.0
  confidence_min: 0.25          # minimum confidence to even consider a decoded SAME burst
  relay:
    enabled: true
    events:
      - ADR
      - AVA
      - AVW
      - BLU
      - BZW
      - CAE
      - CDW
      - CEM
      - CFA
      - CFW
      - DMO
      - DSW
      - EQW
      - EVI
      - EWW
      - FFA
      - FFS
      - FFW
      - FLA
      - FLS
      - FLW
      - FRW
      - HLS
      - HMW
      - HUA
      - HUW
      - HWA
      - HWW
      - LAE
      - LEW
      - NUW
      - RHW
      - RMT
      - RWT
      - SMW
      - SPS
      - SQW
      - SSA
      - SSW
      - SVA
      - SVR
      - SVS
      - TOA
      - TOE
      - TOR
      - TRA
      - TRW
      - TSA
      - TSW
      - VOA
      - VOW
      - WSA
      - WSW
    min_confidence: 0.79
    cooldown_seconds: 300
    senders: []                 # empty = accept any sender; e.g. ["WJON", "WJONIP"]

# samedec decoder subprocess settings (used by ern_gwes when samedec backend is active)
samedec:
  bin: "/usr/local/bin/samedec"
  confidence: 0.85
  start_delay_s: 1.4

# RWT/RMT test scheduling
tests:
  enabled: true
  # Global fallback used by tests that do not set their own policy.
  # Valid policies: none, fixed_delay, delay_window, next_day, skip_day, skip_week.
  postpone_policy: delay_window
  postpone_minutes: 15         # retry delay for fixed_delay/delay_window policies
  max_postpone_hours: 6        # retry window for fixed_delay/delay_window policies
  max_postpone_days: 2         # retry days for next_day policy
  jitter_seconds: 60           # random jitter around scheduled time
  toneout_cooldown_seconds: 1800  # don't tone again this soon after a test (matches min_heightened_seconds)
  cap_block_seconds: 3600      # block CAP full cut-ins for this long after a test
  ern_block_seconds: 3600      # block ERN relays for this long after a test
  presentation:
    headline_template: "{event} for the {service_area_name}"
    area_text: ""              # blank = resolve SAME coverage names, fallback to service_area_name
    discord_area_text: ""      # blank = use resolved coverage text in Discord embeds too
  rwt:
    weekday: 3                 # 0=Mon … 6=Sun
    hour: 11
    minute: 0
    postpone_policy: next_day  # NWS-style: suppress today, retry next eligible day
    max_postpone_days: 2
    gate:
      block_heightened: true
      block_recent_toneout: true
      block_recent_severe_cap: true
      block_recent_ern: true
  rmt:
    nth: 1                     # which occurrence of weekday in month (1 = first)
    weekday: 3
    hour: 11
    minute: 0
    postpone_policy: delay_window
    postpone_minutes: 30
    max_postpone_hours: 6
    gate:
      block_heightened: true
      block_recent_toneout: true
      block_recent_severe_cap: true
      block_recent_ern: true

# NWS UGC → SAME FIPS crosswalk (zone-to-county mapping)
zonecounty:
  enabled: true
  dbx_url: "https://www.weather.gov/source/gis/Shapefiles/County/bp03mr26.dbx"
  cache_days: 30
  index_url: "https://www.weather.gov/gis/ZoneCounty"
  base_url: "https://www.weather.gov/source/gis/Shapefiles/County/"

# Marine zone → coastal county FIPS crosswalk
mareas:
  enabled: true
  url: "https://www.weather.gov/source/gis/Shapefiles/WSOM/mareas18mr25.txt"
  cache_days: 30

# Station feed (SQLite-backed public API read model)
station_feed:
  enabled: true
  station_id: "seasonalweather"
  source: "seasonalweather"
  max_items: 24
  ttl_seconds: 7200
  fetch_nws: false             # attempt to fetch NWS alert detail on write
  debug: false
  ern_area_names: true         # include area name strings from ERN decoded alerts
  housekeeping:
    enabled: true
    interval_sec: 60
    grace_sec: 5
    housekeep_seconds: 30
  nwws:
    vtec_event_labels: {}      # optional StationFeed display overrides, e.g. {"WW.Y": "Winter Weather Advisory"}
    tz_abbrev_overrides: {}    # optional timezone overrides/extensions, e.g. {"CHST": "+10:00"}


# HTTP API server settings
api:
  auth:
    mode: "static"               # static | exchange | hybrid (hybrid is migration-only)
    subject: "local-admin"       # subject name for SEASONAL_API_TOKEN
    scopes: "read:health read:status read:alerts read:config control:cycle control:mode control:tests control:originate control:audio control:inserts control:config"
    exchange:
      minimum_ttl_seconds: 60
      default_ttl_seconds: 900
      maximum_read_ttl_seconds: 3600
      maximum_write_ttl_seconds: 900
  allow_remote: false           # bind to 0.0.0.0 if true; localhost-only if false
  audio_max_bytes: 20971520     # 20 MiB — max upload size for audio inject endpoint
  audio_max_seconds: 180        # max audio clip duration accepted
  audio_ttl_seconds: 86400      # how long injected audio files are kept on disk
  ffmpeg_bin: "ffmpeg"
  full_eas_heightened: false    # entering heightened mode on full EAS cut-ins
  manual_full_eas_heightens: true

# Cross-source alert deduplication window
dedupe:
  ttl_seconds: 900              # 15 minutes

tts:
  backend: "local"           # canonical P1-16 backend identity
                              # Legacy backend: <engine> spelling remains compatibility-only.
  fallback_backend: null      # local | seasonal_ttsd | openai_compatible
  local:
    engine: "espeak-ng"       # espeak-ng | piper | festival | dectalk | voicetext_paul | spfy
    voice: "9"
    rate_wpm: 165
    voicetext_paul:
      run_as: "voicetext"        # compatibility field; worker runs the wrapper as UID 10001
      retries: 1
      retry_sleep_ms: 150
      reset_every: 0             # reset process every N calls (0 = never)
      kill_before: false         # SIGKILL old process before each run
      vtml_lexicon: true         # apply the built-in VTML lexicon substitutions

      # Manual VTML alias overrides (VoiceText Paul only)
      alias_overrides: []
      # Example:
      # alias_overrides:
      #   - match: "\\bSMW\\b"
      #     alias: "Special Marine Warning"
      #     regex: true
      #     ignore_case: true

      # Manual x-cmu phoneme overrides (VoiceText Paul only)
      phoneme_overrides_x_cmu: []
      # Example:
      # phoneme_overrides_x_cmu:
      #   - match: "\\bthunderstorm\\b"
      #     ph: "TH AH1 N D ER0 S T AO2 R M"
      #     regex: true
      #     ignore_case: true
  # Optional remote adapters are intentionally unconfigured and disabled
  # unless selected as backend or fallback_backend.
  seasonal_ttsd:
    base_url: ""
    # With compose.seasonal-ttsd.yaml, use
    # /run/secrets/SEASONAL_TTSD_CLIENT_CREDENTIAL when this backend is selected.
    client_credential_file: ""
    voice: "voicetext-paul"
    profile: "wav-48k-stereo"
    token_ttl_seconds: 900
    refresh_margin_seconds: 120
    connect_timeout_seconds: 5.0
    token_timeout_seconds: 10.0
    synthesis_timeout_seconds: 180.0
    max_input_bytes: 65536
    max_response_bytes: 67108864
    max_error_bytes: 16384
    verify_tls: true
  openai_compatible:
    base_url: ""
    api_key_file: ""
    model: ""
    voice: ""
    response_format: "wav"
    speed: 1.0
    connect_timeout_seconds: 5.0
    synthesis_timeout_seconds: 180.0
    max_input_bytes: 65536
    max_response_bytes: 67108864
    max_error_bytes: 16384
    verify_tls: true
  volume: 1.0

  # Generic text replacements applied to ALL TTS backends after clean_for_tts().
  # Useful for simple QoL pronunciation fixes that do not need backend-specific phonemes.
  text_overrides: []
  # Example:
  # text_overrides:
  #   - match: "NWR"
  #     replace: "NOAA Weather Radio"
  #     regex: false
  #     ignore_case: false

audio:
  sample_rate: 48000
  attention_tone_hz: 1050
  attention_tone_seconds: 8.0
  eom_beep_hz: 1000
  eom_beep_seconds: 0.6
  inter_segment_silence_seconds: 0.35
  post_alert_silence_seconds: 1.2

paths:
  work_dir: "/var/lib/seasonalweather"
  operational_state_dir: "/var/lib/seasonalweather/state"
  job_state_dir: "/var/lib/seasonalweather/jobs"
  artifact_dir: "/var/lib/seasonalweather/artifacts"
  audio_dir: "/var/lib/seasonalweather/artifacts/audio"
  cache_dir: "/var/lib/seasonalweather/state/cache"
  config_dir: "/etc/seasonalweather"
  log_dir: "/var/log/seasonalweather"
  diagnostic_export_dir: "/usr/share/seasonalweather/diagnostics"
  temporary_dir: "/tmp"
  runtime_dir: "/run/seasonalweather"
  secret_dir: "/run/secrets"

# Controller-owned graceful shutdown. Values are restart-time configuration.
# The total deadline caps the complete drain; stage deadlines must not exceed it.
lifecycle:
  total_seconds: 30.0
  active_request_seconds: 10.0
  publication_seconds: 8.0
  source_stop_seconds: 8.0
  tts_stop_seconds: 8.0
  task_cancel_seconds: 5.0
  resource_close_seconds: 5.0
  optional_tasks:
    # never = leave degraded, restart = bounded recovery, always = retry
    # after each cooldown. Drain/cancel always suppresses restart.
    policy: "restart"
    stable_after_seconds: 60.0
    restart_initial_delay_seconds: 1.0
    restart_max_delay_seconds: 30.0
    thrash_window_seconds: 300.0
    thrash_limit: 3
    cooldown_seconds: 300.0

database:
  enabled: true
  path: "/var/lib/seasonalweather/state/seasonalweather.sqlite3"  # also stores exchange clients, tokens, and auth audit
  busy_timeout_ms: 5000
  journal_mode: "WAL"
  postgres:
    # PostgreSQL is an optional archive only; it is never required for
    # routine broadcasting. The endpoint remains disabled by default under
    # network.postgresql.enabled.
    mode: "optional"
    role: "archive"
    schema: "public"
    migration_table: "seasonalweather_schema_metadata"
    clock_skew_seconds: 5.0
  housekeeping:
    enabled: true
    interval_seconds: 900        # 15m periodic DB cleanup / reconciliation
    startup_delay_seconds: 45    # give startup/import a moment before first pass
    api_command_retention_days: 14
    audio_asset_grace_seconds: 900
    generated_audio_retention_seconds: 10800  # prune unreferenced generated WAVs older than 3h
    generated_audio_max_bytes: 1073741824     # soft cap: delete oldest unreferenced generated WAVs above 1GiB
    tmp_file_grace_seconds: 900               # prune stale temp files after 15m
    wal_checkpoint: true

# Controller-owned durable bounded jobs. This database is deliberately separate
# from database.path and must be on a local filesystem (NFS/SMB are unsupported).
# P2-08 requires live workers for job readiness; no controller-local fallback is
# enabled when workers are absent.
jobs:
  enabled: true
  required: true
  path: "/var/lib/seasonalweather/jobs/jobs.sqlite3"
  busy_timeout_ms: 5000
  lease_seconds: 60
  assignment_ack_seconds: 10
  progress_retention: 100
  event_retention: 500
  reconciliation_batch_size: 100
  payload_max_bytes: 65536
  result_max_bytes: 65536
  shutdown_reconciliation_seconds: 5.0

